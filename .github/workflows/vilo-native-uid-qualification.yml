# SOURCE DRAFT ONLY. No publish/run authorization; does not close B02/P0.
name: Vilo one-time native UID qualification
"on":
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: vilo-native-uid-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: macos-26
    timeout-minutes: 6
    steps:
      - name: Owned synthetic UID and GUI qualification only
        shell: /usr/bin/python3 -I -S {0}
        run: |
          """Workflow-only unprivileged launcher; FILES is frozen inline by the renderer.
          
          No checkout/actions/network/download. Existing compilers only. This file is not
          executed during source preparation. Source review and new user approval remain
          required before publishing/running the resulting workflow.
          """
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import selectors
          import shutil
          import subprocess
          import tempfile
          import time
          
          FILES = {'identity.c': '', 'WindowFixture.swift': '', 'qualification.py': ''}
          
          
          def run_fixed(argv, timeout, output_cap):
              child = subprocess.Popen(argv, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                                       stderr=subprocess.STDOUT, close_fds=True,
                                       env={"PATH": "/usr/bin:/bin:/usr/sbin:/sbin", "LANG": "C",
                                            "LC_ALL": "C", "PYTHONDONTWRITEBYTECODE": "1",
                                            "PYTHONNOUSERSITE": "1"})
              data = bytearray()
              sel = selectors.DefaultSelector()
              sel.register(child.stdout, selectors.EVENT_READ)
              deadline = time.monotonic() + timeout
              try:
                  while sel.get_map():
                      if time.monotonic() > deadline:
                          raise RuntimeError("command_deadline_cleanup_unknown")
                      for key, _ in sel.select(0.05):
                          block = os.read(key.fileobj.fileno(), 4096)
                          if not block:
                              sel.unregister(key.fileobj)
                          else:
                              data.extend(block)
                              if len(data) > output_cap:
                                  raise RuntimeError("command_output_budget_cleanup_unknown")
                  child.wait(timeout=max(0.01, deadline - time.monotonic()))
                  return child.returncode, bytes(data)
              finally:
                  if child.poll() is None:
                      child.kill()  # own direct child only; descendant cleanup is UNKNOWN on failure
                  child.wait(timeout=1)
                  child.stdout.close()
                  sel.close()
          
          
          def main():
              if os.getuid() == 0 or not FILES or os.environ.get("GITHUB_REPOSITORY") != "shiengng12345/vilo-editor":
                  raise RuntimeError("fixed_disposable_workflow_context_required")
              stage = Path(tempfile.mkdtemp(prefix="vilo-qualification-source-", dir=os.environ["RUNNER_TEMP"]))
              try:
                  for name, encoded in FILES.items():
                      if name not in ("identity.c", "WindowFixture.swift", "qualification.py"):
                          raise RuntimeError("unexpected_embedded_source")
                      (stage / name).write_bytes(base64.b64decode(encoded, validate=True))
                  compiles = [
                      ["/usr/bin/xcrun", "--sdk", "macosx", "clang", "-Wall", "-Wextra", "-Werror",
                       str(stage / "identity.c"), "-o", str(stage / "identity")],
                      ["/usr/bin/xcrun", "--sdk", "macosx", "swiftc", "-swift-version", "5",
                       str(stage / "WindowFixture.swift"), "-o", str(stage / "WindowFixture")],
                  ]
                  for argv in compiles:
                      try:
                          code, output = run_fixed(argv, 45, 16384)
                      except RuntimeError as error:
                          print(json.dumps({"result": "NO_GO_EXISTING_COMPILER_BOUND",
                              "reason": str(error), "compiler_descendant_cleanup": "UNKNOWN",
                              "B02_pass": False, "P0_pass": False}))
                          return 2
                      if code:
                          print(json.dumps({"result": "NO_GO_EXISTING_COMPILER", "exit_code": code,
                              "diagnostic_bytes": len(output), "diagnostic_sha256": hashlib.sha256(output).hexdigest(),
                              "diagnostic_excerpt": output.decode("utf-8", "replace")[:1200],
                              "compiler_descendant_cleanup": "UNKNOWN", "B02_pass": False, "P0_pass": False}))
                          return 2
                  if sum(path.stat().st_size for path in stage.iterdir()) > 16 * 1024 * 1024:
                      raise RuntimeError("compiled_artifact_budget")
                  code, output = run_fixed(["/usr/bin/sudo", "-n", "/usr/bin/python3", "-I", "-S",
                                            str(stage / "qualification.py"), str(stage),
                                            str(os.getuid()), str(os.getgid())], 240, 65536)
                  print(output.decode("utf-8", "replace"), end="", flush=True)
                  return code
              finally:
                  shutil.rmtree(stage)  # this unprivileged launcher's own random staging dir only
          
          
          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except Exception as error:
                  print(json.dumps({"result": "NO_GO", "error": str(error)[:180],
                                    "cleanup": "UNKNOWN", "B02_pass": False, "P0_pass": False}), flush=True)
                  raise SystemExit(2)
