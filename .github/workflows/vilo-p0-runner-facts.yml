name: Vilo P0 runner facts

'on':
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: vilo-p0-runner-facts
  cancel-in-progress: false

jobs:
  runner_facts:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Report bounded runner facts
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re
          import selectors
          import shutil
          import subprocess
          import time

          def command_value(argv, kind):
              result = {"status": "unknown", "value": None, "exit_code": None}
              process = None
              selector = selectors.DefaultSelector()
              buffers = [bytearray(), bytearray()]
              captured = 0
              deadline = time.monotonic() + 2
              try:
                  process = subprocess.Popen(argv, stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  selector.register(process.stdout, selectors.EVENT_READ, 0)
                  selector.register(process.stderr, selectors.EVENT_READ, 1)
                  while selector.get_map():
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          raise subprocess.TimeoutExpired(argv, 2)
                      for key, _ in selector.select(min(remaining, 0.1)):
                          chunk = os.read(key.fileobj.fileno(), min(256, 512 - captured))
                          if not chunk:
                              selector.unregister(key.fileobj)
                              continue
                          buffers[key.data].extend(chunk)
                          captured += len(chunk)
                          if captured >= 512:
                              raise OverflowError("bounded command output")
                  process.wait(timeout=max(0.001, deadline - time.monotonic()))
                  result["exit_code"] = process.returncode
                  if process.returncode != 0:
                      result["error_type"] = "CommandFailed"
                  else:
                      value = bytes(buffers[0]).decode("ascii").strip()
                      pattern = r"[0-9]{1,20}" if kind == "integer" else r"[A-Za-z0-9_.-]{1,128}"
                      if not re.fullmatch(pattern, value):
                          raise ValueError("unexpected metadata shape")
                      result.update(status="observed", value=int(value) if kind == "integer" else value)
              except Exception as error:
                  result["error_type"] = type(error).__name__
              finally:
                  cleanup_errors = []
                  try:
                      selector.close()
                  except Exception as error:
                      cleanup_errors.append(type(error).__name__)
                  if process is not None:
                      try:
                          if process.poll() is None:
                              process.kill()
                              process.wait(timeout=0.5)
                      except Exception as error:
                          cleanup_errors.append(type(error).__name__)
                      result["exit_code"] = process.returncode
                      for stream in (process.stdout, process.stderr):
                          if stream is not None:
                              try:
                                  stream.close()
                              except Exception as error:
                                  cleanup_errors.append(type(error).__name__)
                  for buffer in buffers:
                      buffer.clear()
                  if cleanup_errors:
                      result.update(status="unknown", value=None, cleanup="unknown",
                                    cleanup_error_types=cleanup_errors)
                  result["captured_bytes"] = captured
              return result

          source = {}
          for name in ("GITHUB_REPOSITORY", "GITHUB_SHA", "GITHUB_WORKFLOW_REF",
                       "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"):
              value = os.environ.get(name)
              if value and len(value) <= 512 and all(ord(c) >= 32 and ord(c) != 127 for c in value):
                  source[name] = {"status": "observed", "value": value}
              else:
                  source[name] = {"status": "unknown"}

          facts = {
              "os_version": command_value(["/usr/bin/sw_vers", "-productVersion"], "text"),
              "os_build": command_value(["/usr/bin/sw_vers", "-buildVersion"], "text"),
              "architecture": command_value(["/usr/sbin/sysctl", "-n", "hw.machine"], "text"),
              "logical_cpu_count": command_value(["/usr/sbin/sysctl", "-n", "hw.ncpu"], "integer"),
              "physical_memory_bytes": command_value(["/usr/sbin/sysctl", "-n", "hw.memsize"], "integer"),
              "memory_pressure_level_raw": command_value(["/usr/sbin/sysctl", "-n", "kern.memorystatus_vm_pressure_level"], "integer"),
          }

          devices = {}
          targets = []
          for label, variable in (("workspace", "GITHUB_WORKSPACE"),
                                  ("runner_temp", "RUNNER_TEMP"), ("home", "HOME")):
              target = {"kind": label, "status": "unknown"}
              try:
                  path = os.environ.get(variable)
                  if not path or not os.path.isabs(path):
                      raise ValueError("missing absolute metadata target")
                  device = str(os.stat(path).st_dev)
                  if device not in devices:
                      usage = shutil.disk_usage(path)
                      devices[device] = {
                          "device": device, "target_kinds": [], "total_bytes": usage.total,
                          "used_bytes": usage.used, "free_bytes": usage.free,
                          "free_at_least_30GiB": usage.free >= 30 * 1024 ** 3,
                      }
                  devices[device]["target_kinds"].append(label)
                  target.update(status="observed", device=device)
              except Exception as error:
                  target["error_type"] = type(error).__name__
              targets.append(target)

          complete = all(t["status"] == "observed" for t in targets)
          print(json.dumps({
              "kind": "vilo_p0_runner_facts", "observed_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source": source, "facts": facts,
              "disk_devices": list(devices.values()), "disk_targets": targets,
              "all_required_disk_targets_observed": complete,
              "all_devices_meet_30GiB": all(d["free_at_least_30GiB"] for d in devices.values()) if complete else None,
              "heavy_build_admitted": False,
              "not_validated": ["Rust build", "native GUI", "VM lifecycle", "Phase 0"],
          }, sort_keys=True))
          PY
