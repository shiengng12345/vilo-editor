[package]
name = "vilo_database_core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/vilo_database_core.rs"
doctest = false

[dependencies]
anyhow.workspace = true
futures.workspace = true
mongodb = "3.3"
fred = { version = "10.1", default-features = false, features = ["i-std", "i-memory"] }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
