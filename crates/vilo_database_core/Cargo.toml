[package]
name = "vilo_database_core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/vilo_database_core.rs"
doctest = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
futures.workspace = true
mongodb = "3.3"
fred = { version = "10.1", default-features = false, features = ["i-std", "i-memory", "i-cluster", "i-pubsub", "enable-rustls-ring", "sentinel-auth"] }
rustls = { workspace = true, features = ["ring"] }
rustls-native-certs = "0.8"
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
url.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["time", "macros", "sync", "net", "io-util"] }

[dev-dependencies]
rmpv = "1.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
